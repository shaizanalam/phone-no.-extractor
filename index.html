<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e0e5ec;
    --shadow-light: #ffffff;
    --shadow-dark: #a3b1c6;
    --accent: #5b8dee;
    --accent-glow: rgba(91,141,238,0.35);
    --text-main: #3a3f5c;
    --text-muted: #7b88a0;
    --success: #48c78e;
    --danger: #f14668;
    --card-bg: #e0e5ec;
  }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 40px 36px;
    width: 100%;
    max-width: 520px;
    box-shadow: 8px 8px 20px var(--shadow-dark), -8px -8px 20px var(--shadow-light);
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .icon-wrap {
    width: 72px; height: 72px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background: var(--bg);
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 400;
  }

  /* Upload Zone */
  .upload-zone {
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 24px;
    background: var(--bg);
    box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);
    transition: all 0.25s ease;
    position: relative;
  }

  .upload-zone.dragover {
    box-shadow: inset 6px 6px 14px var(--shadow-dark), inset -6px -6px 14px var(--shadow-light), 0 0 0 2px var(--accent);
  }

  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon { font-size: 36px; margin-bottom: 10px; }

  .upload-text {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .upload-text span {
    color: var(--accent);
    font-weight: 700;
  }

  .file-count {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
    min-height: 18px;
  }

  /* Button */
  .btn-extract {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: var(--bg);
    color: var(--accent);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 28px;
  }

  .btn-extract:hover:not(:disabled) {
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    color: #3a6fd8;
  }

  .btn-extract:active:not(:disabled) {
    box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
  }

  .btn-extract:disabled {
    opacity: 0.5; cursor: not-allowed;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 20px;
    display: none;
  }

  .progress-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }

  .progress-track {
    height: 10px;
    border-radius: 10px;
    background: var(--bg);
    box-shadow: inset 3px 3px 7px var(--shadow-dark), inset -3px -3px 7px var(--shadow-light);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), #7eb3ff);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* Output */
  .output-section { display: none; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .output-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex; align-items: center; gap: 6px;
  }

  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .btn-copy {
    padding: 8px 16px;
    border: none;
    border-radius: 12px;
    background: var(--bg);
    color: var(--text-muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    transition: all 0.2s;
    display: flex; align-items: center; gap: 5px;
  }

  .btn-copy:hover { color: var(--accent); }
  .btn-copy:active { box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light); }
  .btn-copy.copied { color: var(--success); }

  .output-box {
    border-radius: 16px;
    padding: 20px;
    background: var(--bg);
    box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);
    font-family: 'Courier New', monospace;
    font-size: 0.88rem;
    color: var(--text-main);
    line-height: 1.9;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .output-box::-webkit-scrollbar { width: 5px; }
  .output-box::-webkit-scrollbar-track { background: transparent; }
  .output-box::-webkit-scrollbar-thumb { background: var(--shadow-dark); border-radius: 10px; }

  .no-results {
    color: var(--danger);
    font-size: 0.85rem;
    text-align: center;
    padding: 8px 0;
    font-weight: 600;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--text-main);
    color: #fff;
    padding: 10px 22px;
    border-radius: 40px;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    opacity: 0;
    transition: all 0.35s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="icon-wrap">📱</div>
    <h1>Phone Extractor</h1>
    <p class="subtitle">Upload screenshots · Extract Indian numbers instantly</p>
  </div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="imageInput" accept="image/*" multiple onchange="updateFileCount()">
    <div class="upload-icon">🖼️</div>
    <div class="upload-text"><span>Click to upload</span> or drag & drop</div>
    <div class="upload-text" style="margin-top:4px; font-size:0.76rem;">PNG, JPG, WEBP supported</div>
    <div class="file-count" id="fileCount"></div>
  </div>

  <button class="btn-extract" id="extractBtn" onclick="processImages()">
    <span>🔍</span> Extract Numbers
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressText">Processing…</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="output-section" id="outputSection">
    <div class="output-header">
      <div class="output-label">
        📋 Results <span class="badge" id="countBadge">0</span>
      </div>
      <button class="btn-copy" id="copyBtn" onclick="copyNumbers()">
        <span>📄</span> Copy All
      </button>
    </div>
    <div class="output-box" id="output"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

 <p> BY Shaizan Alam</p>

<script>
  let extractedNumbers = [];

  // Drag & drop
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    document.getElementById('imageInput').files = e.dataTransfer.files;
    updateFileCount();
  });

  function updateFileCount() {
    const files = document.getElementById('imageInput').files;
    const el = document.getElementById('fileCount');
    if (files.length === 0) { el.textContent = ''; return; }
    el.textContent = `${files.length} file${files.length > 1 ? 's' : ''} selected`;
  }

  async function processImages() {
    const files = document.getElementById('imageInput').files;
    if (!files.length) { showToast('⚠️ Please upload at least one image'); return; }

    const btn = document.getElementById('extractBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Processing…';

    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('outputSection').style.display = 'none';
    extractedNumbers = [];

    const phonePattern = /(?:\+91[\s-]?|91[\s-]?)?([6-9]\d{4})[\s\-.]?(\d{5})/g;
    let numbers = new Set();

    for (let i = 0; i < files.length; i++) {
      const pct = Math.round(((i) / files.length) * 100);
      setProgress(pct, `Image ${i + 1} of ${files.length}`);
      const { data: { text } } = await Tesseract.recognize(files[i], 'eng');
      phonePattern.lastIndex = 0;
      let match;
      while ((match = phonePattern.exec(text)) !== null) {
        numbers.add(match[1] + match[2]);
      }
    }

    setProgress(100, 'Done!');
    extractedNumbers = Array.from(numbers).sort();

    setTimeout(() => {
      document.getElementById('progressWrap').style.display = 'none';
      const outSection = document.getElementById('outputSection');
      const outBox = document.getElementById('output');
      const badge = document.getElementById('countBadge');
      outSection.style.display = 'block';
      badge.textContent = extractedNumbers.length;

      if (extractedNumbers.length === 0) {
        outBox.innerHTML = '<div class="no-results">No phone numbers found.</div>';
      } else {
        outBox.textContent = extractedNumbers.join('\n');
      }
      btn.disabled = false;
      btn.innerHTML = '<span>🔍</span> Extract Numbers';
      showToast(`✅ Found ${extractedNumbers.length} number${extractedNumbers.length !== 1 ? 's' : ''}`);
    }, 400);
  }

  function setProgress(pct, label) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressText').textContent = label;
  }

  function copyNumbers() {
    if (!extractedNumbers.length) { showToast('Nothing to copy!'); return; }
    navigator.clipboard.writeText(extractedNumbers.join('\n')).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = '<span>✅</span> Copied!';
      showToast('📋 All numbers copied!');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<span>📄</span> Copy All';
      }, 2000);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
